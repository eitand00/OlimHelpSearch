version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olim_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - olim-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: olim_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - olim-network

networks:
  olim-network:
    driver: bridge
